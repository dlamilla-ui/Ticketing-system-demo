name: Alerta NOC → Voximplant Kit

# Simula el envío del ticketing (Cherwell/Oracle) hacia Kit.
# - Manual: Actions → "Alerta NOC → Voximplant Kit" → Run workflow
# - Automático: al hacer push de un JSON nuevo o modificado en events/
on:
  workflow_dispatch:
    inputs:
      event_file:
        description: Archivo JSON del incidente
        default: events/incidente-demo.json
        required: true
      dry_run:
        description: Solo mostrar la petición (no llamar)
        type: boolean
        default: false
  push:
    paths:
      - 'events/**.json'

permissions:
  contents: read

concurrency:
  group: noc-alert
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Elegir archivos de evento
        id: files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_FILE: ${{ inputs.event_file }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$EVENT_FILE" in
              events/*.json) ;;
              *) echo "El archivo debe estar en events/ y terminar en .json"; exit 1 ;;
            esac
            echo "list=$EVENT_FILE" >> "$GITHUB_OUTPUT"
          else
            list=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'events/*.json' | tr '\n' ' ')
            echo "list=$list" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar a Kit y lanzar la llamada de alerta
        if: steps.files.outputs.list != ''
        env:
          KIT_API_HOST: ${{ secrets.KIT_API_HOST }}
          KIT_DOMAIN: ${{ secrets.KIT_DOMAIN }}
          KIT_ACCESS_TOKEN: ${{ secrets.KIT_ACCESS_TOKEN }}
          KIT_SCENARIO_ID: ${{ secrets.KIT_SCENARIO_ID }}
          KIT_PHONE_NUMBER_ID: ${{ secrets.KIT_PHONE_NUMBER_ID }}
          DEMO_PHONE: ${{ secrets.DEMO_PHONE }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FILE_LIST: ${{ steps.files.outputs.list }}
        shell: bash
        run: |
          for f in $FILE_LIST; do
            echo "::group::$f"
            node scripts/trigger-kit.mjs "$f"
            echo "::endgroup::"
          done
